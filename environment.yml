# Conda environment for the KLK4 isoform analysis.
# Versions used in the analysis. FLAIR was run as a 2.2.0 development version
# from source; flair=2.2.0 from bioconda is the corresponding release.
name: klk4-isoforms
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.11
  - flair=2.2.0
  - minimap2=2.30                  # used: 2.30-r1287
  - samtools=1.22.1
  - bcftools=1.22
  - htslib                         # bgzip/tabix
  - seqkit=2.4.0
  - bedtools=2.31.1
  - gffread=0.12.7
  - ucsc-bedtogenepred=482
  - ucsc-genepredtogtf=482
  - racon=1.5.0
  - freebayes=1.3.10
  - vcflib=1.0.14
  - whatshap=2.8
  - pychopper=2.7.10
  - pysam=0.22.1
  - numpy=2.3.2
  - matplotlib-base=3.11.2         # step 10; Figs. 6, 7 and S1 were checked against this version
  - seaborn=0.13.2
